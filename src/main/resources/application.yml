spring:
  application:
    name: seetzu-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/seetzu
    username: seetzu
    password: seetzu
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# 개발용 기본값 — 운영 배포 전엔 반드시 환경변수로 교체할 것.
jwt:
  secret: seetzu-dev-jwt-secret-change-me-before-shipping-0123456789
  expiration-minutes: 10080
