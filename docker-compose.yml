services:
  postgres:
    image: postgres:16
    container_name: seetzu-postgres
    environment:
      POSTGRES_DB: seetzu
      POSTGRES_USER: seetzu
      POSTGRES_PASSWORD: seetzu
    ports:
      - "5433:5432"
    volumes:
      - seetzu_pgdata:/var/lib/postgresql/data

volumes:
  seetzu_pgdata:
